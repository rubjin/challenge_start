<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI 컴포넌트 스타일 가이드</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* html 그리드 오버라이드 - PC 레이아웃 */
    html { display: block !important; grid-template-columns: none !important; }
    body { background-color: #f9fafb; padding: 0; margin: 0; min-width: 1200px; }

    /* 스티키 네비게이션 */
    .guideNav {
      position: sticky; top: 0; z-index: 100;
      background-color: #fff; border-bottom: 1px solid #e5e7eb;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .guideNavInner {
      max-width: 1200px; margin: 0 auto; padding: 0 40px;
      display: flex; align-items: center; gap: 0;
    }
    .guideNavItem {
      padding: 16px 24px; font-size: 15px; font-weight: 600;
      color: #6b7280; white-space: nowrap; cursor: pointer;
      border-bottom: 3px solid transparent; transition: all 0.2s;
      background: none; border-top: none; border-left: none; border-right: none;
    }
    .guideNavItem:hover { color: #1f2937; background-color: #fefce8; }
    .guideNavItem.isActive {
      color: #1f2937; border-bottom-color: #FFDC00;
    }

    /* 가이드 레이아웃 */
    .guideWrapper { max-width: 1200px; margin: 0 auto; padding: 40px 40px 80px; }
    .guideHeader { margin-bottom: 48px; border-bottom: 3px solid rgb(255,188,0); padding-bottom: 24px; }
    .guideHeader h1 { font-size: 36px; margin: 0 0 12px 0; color: #111; }
    .guideHeader p { color: #666; margin: 0; font-size: 16px; }
    .guideSection { margin-bottom: 60px; scroll-margin-top: 70px; }
    .guideTitle { font-size: 24px; font-weight: bold; margin-bottom: 24px; color: #1f2937; display: flex; align-items: center; }
    .guideTitle::before { content: ''; display: inline-block; width: 6px; height: 24px; background-color: rgb(255,188,0); margin-right: 12px; border-radius: 3px; }

    /* 가이드 박스 */
    .guideBox { padding: 30px; border: 1px dashed #d1d5db; border-radius: 8px 8px 0 0; display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
    .guideBoxBlock { display: block; }

    /* 사이즈 레이블 */
    .guideSizeLabel {
      display: block; font-size: 12px; font-weight: 700; color: #9ca3af;
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
    }
    .guideSizeGroup { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-end; }
    .guideSizeItem { display: flex; flex-direction: column; align-items: flex-start; }

    /* 서브 타이틀 */
    .guideSubtitle {
      font-size: 16px; font-weight: 600; color: #374151;
      margin: 28px 0 14px; padding-left: 16px; border-left: 3px solid #FFDC00;
    }

    /* 코드 블록 */
    .guideCodeWrap {
      border: 1px dashed #d1d5db; border-top: none; border-radius: 0 0 8px 8px;
      overflow: hidden; margin-bottom: 24px;
    }
    .guideCodeHeader {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 20px; background-color: #f3f4f6; border-top: 1px solid #e5e7eb;
    }
    .guideCodeToggle {
      font-size: 13px; font-weight: 600; color: #6b7280;
      cursor: pointer; background: none; border: none; padding: 6px 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .guideCodeToggle:hover { color: #1f2937; }
    .guideCodeToggle svg { width: 14px; height: 14px; transition: transform 0.2s; }
    .guideCodeToggle.isOpen svg { transform: rotate(180deg); }
    .guideCodeCopy {
      font-size: 13px; font-weight: 600; color: #6b7280;
      cursor: pointer; background: none; border: 1px solid #d1d5db;
      padding: 6px 14px; border-radius: 4px; transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .guideCodeCopy:hover { background-color: #e5e7eb; color: #1f2937; }
    .guideCodeCopy.isCopied { background-color: #d1fae5; color: #065f46; border-color: #6ee7b7; }
    .guideCodeBlock {
      display: none; padding: 20px 24px; background-color: #1f2937;
      overflow-x: auto; margin: 0;
    }
    .guideCodeBlock.isOpen { display: block; }
    .guideCodeBlock code {
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px; line-height: 1.7; color: #e5e7eb;
      white-space: pre;
    }

    /* Full width 버튼 별도 박스 */
    .guideBoxFullwidth { gap: 10px; }
    .guideBoxFullwidth .full { display: flex; }
  </style>
  <!-- Syntax Highlighting -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
</head>
<body>

  <!-- 스티키 네비게이션 -->
  <nav class="guideNav">
    <div class="guideNavInner">
      <button type="button" class="guideNavItem isActive" data-target="sectionButtons">Buttons</button>
      <button type="button" class="guideNavItem" data-target="sectionBadges">Badges</button>
      <button type="button" class="guideNavItem" data-target="sectionTabs">Tabs</button>
      <button type="button" class="guideNavItem" data-target="sectionCards">Cards</button>
      <button type="button" class="guideNavItem" data-target="sectionForms">Forms</button>
      <button type="button" class="guideNavItem" data-target="sectionPopups">Popups</button>
    </div>
  </nav>

  <div class="guideWrapper">
    <!-- <header class="guideHeader">
      <h1>프로젝트 UI 컴포넌트 가이드</h1>
      <p>공통으로 사용되는 UI 요소들을 모아둔 페이지입니다. (SCSS Base/Component 기준)</p>
    </header> -->

    <!-- ==================== 1. 버튼 가이드 ==================== -->
    <section id="sectionButtons" class="guideSection">
      <h2 class="guideTitle">Buttons (버튼)</h2>
      <div class="guideBox" style="display: flex; gap: 16px; flex-wrap: wrap; align-items: center;">
        <include src="./src/bo/html/components/button.html"></include>
      </div>
    </section>

    <!-- ==================== 2. 뱃지 가이드 ==================== -->
    <section id="sectionBadges" class="guideSection">
      <h2 class="guideTitle">Badges (상태 뱃지)</h2>
      <div class="guideBox" style="display: flex; gap: 16px; flex-wrap: wrap; align-items: center;">
        <include src="./src/bo/html/components/badge.html"></include>
      </div>
    </section>

    <!-- ==================== 3. 탭 가이드 ==================== -->
    <section id="sectionTabs" class="guideSection">
      <h2 class="guideTitle">Tabs (탭 메뉴)</h2>
      <div class="guideBox guideBoxBlock">
        <include src="./src/bo/html/components/tab.html"></include>
      </div>
    </section>

    <!-- ==================== 4. 카드 가이드 ==================== -->
    <section id="sectionCards" class="guideSection">
      <h2 class="guideTitle">Cards (카드)</h2>
      <div class="guideBox" style="background-color: #f3f4f6;">
        <include src="./src/bo/html/components/card.html"></include>
      </div>
    </section>

    <!-- ==================== 5. 폼 가이드 ==================== -->
    <section id="sectionForms" class="guideSection">
      <h2 class="guideTitle">Forms (입력 폼)</h2>
      <div class="guideBox guideBoxBlock" style="max-width: 600px;">
        <include src="./src/bo/html/components/form.html"></include>
      </div>
    </section>

    <!-- ==================== 6. 팝업 가이드 ==================== -->
    <section id="sectionPopups" class="guideSection">
      <h2 class="guideTitle">Popups (모달 팝업)</h2>
      
      <!-- 팝업 띄우기 트리거 버튼 -->
      <div style="margin-bottom: 24px; display: flex; gap: 12px;">
        <button type="button" class="btn primary" onclick="document.getElementById('popupBasic').classList.add('isOpen')">기본 팝업 열기</button>
        <button type="button" class="btn primary" onclick="document.getElementById('popupLarge').classList.add('isOpen')">Large 팝업 열기</button>
      </div>

      <!-- 팝업 컴포넌트 호출 (기본적으로 숨겨짐) -->
      <include src="./src/bo/html/components/popup.html"></include>
    </section>

    

  </div>

  <script>
    
      // --- 코드 자동 생성 스크립트 ---
      document.addEventListener('DOMContentLoaded', function() {
        var boxes = document.querySelectorAll('.guideBox');
        
        boxes.forEach(function(box) {
          if (box.nextElementSibling && box.nextElementSibling.classList.contains('guideCodeWrap')) return;
          
          var htmlCode = '';
          // 1. 네이티브 CSS 선택자를 이용한 탐색 
          // guideBox 내부에서 레이아웃용 껍데기(wrapper) 클래스 3개(.guideSizeGroup, .guideSizeItem, .guideSizeLabel)를 제외하고 실제 UI 컴포넌트 요소만 가져옵니다.
          var targets = Array.from(box.querySelectorAll('*:not(.guideSizeGroup):not(.guideSizeItem):not(.guideSizeLabel)'));
      
          if (targets.length > 0) {
            // 2. 중첩 방지 (최상위 컴포넌트만 추출)
            var filteredTargets = targets.filter(function(t) {
              var parent = t.parentElement;
              while(parent && parent !== box) {
                // 부모가 껍데기(wrapper) 클래스 중 하나인지 확인
                var isWrapper = parent.matches('.guideSizeGroup, .guideSizeItem, .guideSizeLabel');
                
                // 부모가 껍데기가 아니라면(즉, 부모가 실제 렌더링될 타겟 컴포넌트라면)
                // 현재 요소는 부모 안에 포함된 자식이므로 중첩 렌더링을 막기 위해 제외함
                if (!isWrapper) return false;
                
                parent = parent.parentElement;
              }
              return true;
            });
            
            htmlCode = filteredTargets.map(function(t) { return t.outerHTML; }).join('\n');
          } else {
            htmlCode = box.innerHTML;
          }
          
          // 공백 및 들여쓰기 정리
          var lines = htmlCode.split('\n');
          if (lines.length > 0 && lines[0].trim() === '') lines.shift();
          if (lines.length > 0 && lines[lines.length - 1].trim() === '') lines.pop();
          
          if (lines.length > 0) {
             var match = lines[0].match(/^(\s+)/);
             if (match) {
               var indent = match[1];
               var regex = new RegExp('^' + indent, 'gm');
               htmlCode = lines.join('\n').replace(regex, '');
             } else {
               htmlCode = lines.join('\n');
             }
          }
          
          var wrap = document.createElement('div');
          wrap.className = 'guideCodeWrap';
          wrap.innerHTML = 
            '<div class="guideCodeHeader">' +
              '<button type="button" class="guideCodeToggle" onclick="toggleCode(this)">' +
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg> ' +
                '<span>코드 보기</span>' +
              '</button>' +
              '<button type="button" class="guideCodeCopy" onclick="copyCode(this)">' +
                '<span>코드 복사</span>' +
              '</button>' +
            '</div>' +
            '<pre class="guideCodeBlock"><code class="language-html"></code></pre>';
          
          var codeEl = wrap.querySelector('code');
          codeEl.textContent = htmlCode;
          box.parentNode.insertBefore(wrap, box.nextSibling);
          
          // 하이라이팅 적용
          if (window.Prism) {
            Prism.highlightElement(codeEl);
          }
        });
      });
      // ----------------------------

      // 코드 보기 토글
      function toggleCode(btn) {
        var wrap = btn.closest('.guideCodeWrap');
        var codeBlock = wrap.querySelector('.guideCodeBlock');
        btn.classList.toggle('isOpen');
        codeBlock.classList.toggle('isOpen');
        if (btn.querySelector('span')) {
          btn.querySelector('span').textContent = codeBlock.classList.contains('isOpen') ? ' 코드 닫기' : ' 코드 보기';
        } else {
          btn.childNodes[2].textContent = codeBlock.classList.contains('isOpen') ? ' 코드 닫기' : ' 코드 보기';
        }
      }
  
      // 코드 복사
      function copyCode(btn) {
        var wrap = btn.closest('.guideCodeWrap');
        var code = wrap.querySelector('code').textContent;
        navigator.clipboard.writeText(code).then(function() {
          btn.classList.add('isCopied');
          if (btn.querySelector('span')) {
            btn.querySelector('span').textContent = ' 복사됨';
          } else {
            btn.childNodes[2].textContent = ' 복사됨';
          }
          setTimeout(function() {
            btn.classList.remove('isCopied');
            if (btn.querySelector('span')) {
              btn.querySelector('span').textContent = ' 복사';
            } else {
              btn.childNodes[2].textContent = ' 복사';
            }
          }, 2000);
        });
      }
  
      // 스티키 네비게이션 클릭 -> 컨텐츠 교체 (스크롤 대신 탭 방식)
      document.querySelectorAll('.guideNavItem').forEach(function(navItem) {
        navItem.addEventListener('click', function() {
          // 1. 탭 버튼 활성화 변경
          document.querySelectorAll('.guideNavItem').forEach(function(item) {
            item.classList.remove('isActive');
          });
          this.classList.add('isActive');

          // 2. 타겟 컨텐츠만 보여주고 나머지는 숨김
          var targetId = this.getAttribute('data-target');
          document.querySelectorAll('.guideSection').forEach(function(section) {
            section.style.display = 'none';
          });
          var targetSection = document.getElementById(targetId);
          if (targetSection) {
            targetSection.style.display = 'block';
          }
        });
      });
  
      // 초기 렌더링 시: 첫 번째 섹션만 보이게 하고 나머지 숨김 처리
      document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.guideSection').forEach(function(section, index) {
          if (index !== 0) {
            section.style.display = 'none';
          } else {
            section.style.display = 'block';
          }
        });
      });

      
  </script>

  <!-- Syntax Highlighting JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
</body>
</html>
