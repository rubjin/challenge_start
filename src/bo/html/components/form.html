<!-- Text Input -->
<div class="formGroup">
  <label class="formLabel">텍스트 입력 <span class="required">*</span></label>
  <div class="formControlWrap">
    <input type="text" class="formControl" placeholder="내용을 입력해주세요">
  </div>
</div>

<!-- Text Input (Error State) -->
<div class="formGroup">
  <label class="formLabel">이메일 주소 <span class="required">*</span></label>
  <div class="formControlWrap">
    <input type="email" class="formControl isError" placeholder="example@email.com" value="wrong-email">
    <p class="formErrorMsg">유효하지 않은 이메일 형식입니다.</p>
  </div>
</div>

<!-- Text Input (Disabled) -->
<div class="formGroup">
  <label class="formLabel">사번</label>
  <div class="formControlWrap">
    <input type="text" class="formControl" value="20230001" disabled>
  </div>
</div>

<!-- Textarea -->
<div class="formGroup">
  <label class="formLabel">상세 내용</label>
  <div class="formControlWrap">
    <textarea class="formControl" placeholder="상세 내용을 입력해주세요 (최대 1000자)"></textarea>
  </div>
</div>

<!-- Select Box -->
<div class="formGroup">
  <label class="formLabel">부서 선택</label>
  <div class="formControlWrap">
    <select class="formControl">
      <option value="">부서를 선택해주세요</option>
      <option value="1">기획팀</option>
      <option value="2">디자인팀</option>
      <option value="3">개발팀</option>
    </select>
  </div>
</div>

<!-- Checkbox Group -->
<div class="formGroup">
  <label class="formLabel">권한 설정</label>
  <div class="formCheckGroup">
    <label class="formCheck">
      <input type="checkbox" checked>
      <span class="checkIcon"></span>
      <span class="checkLabel">읽기 권한</span>
    </label>
    <label class="formCheck">
      <input type="checkbox">
      <span class="checkIcon"></span>
      <span class="checkLabel">쓰기 권한</span>
    </label>
    <label class="formCheck">
      <input type="checkbox" disabled>
      <span class="checkIcon"></span>
      <span class="checkLabel">관리자 권한 (접근불가)</span>
    </label>
  </div>
</div>

<!-- Radio Group -->
<div class="formGroup">
  <label class="formLabel">공개 여부</label>
  <div class="formCheckGroup">
    <label class="formCheck">
      <input type="radio" name="publicState" checked>
      <span class="checkIcon"></span>
      <span class="checkLabel">공개</span>
    </label>
    <label class="formCheck">
      <input type="radio" name="publicState">
      <span class="checkIcon"></span>
      <span class="checkLabel">비공개</span>
    </label>
  </div>
</div>

<!-- Input + Button Set -->
<div class="formGroup">
  <label class="formLabel">이메일 인증</label>
  <div class="formControlWrap hasBtn">
    <input type="text" class="formControl" placeholder="이메일 주소를 입력해주세요">
    <button type="button" class="btn outline md">인증번호 발송</button>
  </div>
</div>
