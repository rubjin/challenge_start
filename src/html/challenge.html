<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>챌린지 목록 - 퍼블리싱</title>
  <link rel="stylesheet" href="../css/main.css">
</head>
<body>
  <div class="adminLayout">
    <header class="adminHeader">
      <h1>챌린지</h1>
    </header>
    
    <nav class="tab">
      <button type="button" class="tabItem isActive">진행중인 챌린지</button>
      <button type="button" class="tabItem">종료된 챌린지</button>
    </nav>

    <div class="adminList">
      <!-- Challenge Card 1 -->
      <article class="card">
        <img src="https://via.placeholder.com/300x160" alt="챌린지 썸네일" class="cardThumb" />
        <div class="cardContent">
          <span class="badge badgeOngoing">진행중</span>
          <h2 class="cardTitle">매일 아침 6시 기상하기</h2>
          <p class="cardDesc">건강한 습관을 만들어보세요.</p>
          <button type="button" class="btn btnPrimary">참여하기</button>
        </div>
      </article>

      <!-- Challenge Card 2 -->
      <article class="card">
        <img src="https://via.placeholder.com/300x160" alt="챌린지 썸네일" class="cardThumb" />
        <div class="cardContent">
          <span class="badge badgeCompleted">종료</span>
          <h2 class="cardTitle">주 3회 런닝하기</h2>
          <p class="cardDesc">체력을 기르는 러닝 챌린지</p>
          <button type="button" class="btn btnOutline isDisabled" disabled>기록보기</button>
        </div>
      </article>
    </div>
  </div>
</body>
</html>
