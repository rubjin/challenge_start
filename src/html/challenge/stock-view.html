<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스탁뷰 챌린지</title>
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/stockView.css" />
</head>
<body>
  <div class="svWrapper">
    <!-- 배경 장식용 구체들 -->
    <div class="svBgSphere svBgSphere1"></div>
    <div class="svBgSphere svBgSphere2"></div>
    <div class="svBgSphere svBgSphere3"></div>
    <div class="svBgSphere svBgSphere4"></div>

    <!-- 배경 별/반짝이 효과 -->
    <!-- <div class="svStars">
      <div class="svStar svStar1"></div>
      <div class="svStar svStar2"></div>
      <div class="svStar svStar3"></div>
      <div class="svStar svStar4"></div>
      <div class="svStar svStar5"></div>
      <div class="svStar svStar6"></div>
      <div class="svStar svStar7"></div>
      <div class="svStar svStar8"></div>
    </div> -->

    <!-- 메인 콘텐츠 영역 -->
    <div class="svScene">

      <!-- 회전하는 원형 궤도 띠 (뒷면: 토끼 뒤쪽) -->
      <div class="svOrbit svOrbitBack">
        <div class="svOrbitTilt">
          <img src="../../images/cirlcle.png" alt="" class="svOrbitRing" />
        </div>
      </div>

      <!-- 중앙 토끼 캐릭터 -->
      <div class="svCharacter">
        <img src="../../images/rabbit.png" alt="스탁뷰 토끼" class="svCharacterImg" />
      </div>

      <!-- 회전하는 원형 궤도 띠 (앞면: 토끼 앞쪽, 하단만 노출) -->
      <div class="svOrbit svOrbitFront">
        <div class="svOrbitTilt">
          <img src="../../images/cirlcle.png" alt="" class="svOrbitRing" />
        </div>
      </div>

      <!-- 떠다니는 기업 로고 공들 -->
      <div class="svBall svBallTesla" data-company="Tesla">
        <img src="../../images/ball_tsla.png" alt="Tesla" class="svBallImg" />
      </div>
      <div class="svBall svBallAmazon" data-company="Amazon">
        <img src="../../images/ball_amazon.png" alt="Amazon" class="svBallImg" />
      </div>
      <div class="svBall svBallGoogle" data-company="Google">
        <img src="../../images/ball_google.png" alt="Google" class="svBallImg" />
      </div>


    </div>

  </div>
</div> -->
  </div>
</body>
</html>
