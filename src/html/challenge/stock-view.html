<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스탁뷰 챌린지</title>
  <link rel="stylesheet" href="../../css/main.css" />
  <link rel="stylesheet" href="../../css/stock-view.css" />
</head>
<body>
  <div class="sv-wrapper">
    <!-- 배경 장식용 구체들 -->
    <div class="sv-bg-sphere sv-bg-sphere--1"></div>
    <div class="sv-bg-sphere sv-bg-sphere--2"></div>
    <div class="sv-bg-sphere sv-bg-sphere--3"></div>
    <div class="sv-bg-sphere sv-bg-sphere--4"></div>

    <!-- 배경 별/반짝이 효과 -->
    <!-- <div class="sv-stars">
      <div class="sv-star sv-star--1"></div>
      <div class="sv-star sv-star--2"></div>
      <div class="sv-star sv-star--3"></div>
      <div class="sv-star sv-star--4"></div>
      <div class="sv-star sv-star--5"></div>
      <div class="sv-star sv-star--6"></div>
      <div class="sv-star sv-star--7"></div>
      <div class="sv-star sv-star--8"></div>
    </div> -->

    <!-- 메인 콘텐츠 영역 -->
    <div class="sv-scene">

      <!-- 회전하는 원형 궤도 띠 (뒷면: 토끼 뒤쪽) -->
      <div class="sv-orbit sv-orbit--back">
        <div class="sv-orbit__tilt">
          <img src="../../images/cirlcle.png" alt="" class="sv-orbit__ring" />
        </div>
      </div>

      <!-- 중앙 토끼 캐릭터 -->
      <div class="sv-character">
        <img src="../../images/rabbit.png" alt="스탁뷰 토끼" class="sv-character__img" />
      </div>

      <!-- 회전하는 원형 궤도 띠 (앞면: 토끼 앞쪽, 하단만 노출) -->
      <div class="sv-orbit sv-orbit--front">
        <div class="sv-orbit__tilt">
          <img src="../../images/cirlcle.png" alt="" class="sv-orbit__ring" />
        </div>
      </div>

      <!-- 떠다니는 기업 로고 공들 -->
      <div class="sv-ball sv-ball--tesla" data-company="Tesla">
        <img src="../../images/ball_tsla.png" alt="Tesla" class="sv-ball__img" />
      </div>
      <div class="sv-ball sv-ball--amazon" data-company="Amazon">
        <img src="../../images/ball_amazon.png" alt="Amazon" class="sv-ball__img" />
      </div>
      <div class="sv-ball sv-ball--google" data-company="Google">
        <img src="../../images/ball_google.png" alt="Google" class="sv-ball__img" />
      </div>


    </div>

  <div class="hoop">

  </div>
</div> -->
  </div>
</body>
</html>
